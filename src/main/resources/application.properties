server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5442/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SECURITY: this default is fine for local dev and CI (Testcontainers, ephemeral DBs) but must be
# overridden with a real secret via the IFAY_API_KEY env var in any shared/deployed environment.
ifay.api.key=${IFAY_API_KEY:dev-only-insecure-default-change-me}

mvola.api.url=${MVOLA_API_URL:https://devapi.mvola.mg}
mvola.consumer.key=${MVOLA_CONSUMER_KEY:}
mvola.consumer.secret=${MVOLA_CONSUMER_SECRET:}
mvola.partner.name=${MVOLA_PARTNER_NAME:ifay}
mvola.merchant.msisdn=${MVOLA_MERCHANT_MSISDN:}
