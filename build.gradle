plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.3'
}

repositories {
    mavenCentral()
}

java {
    group = 'vendredi.soir.ifay'
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

tasks.withType(JavaCompile).configureEach {
    // Required for Jackson to resolve constructor parameter names by reflection when
    // deserializing classes with no @JsonCreator/@JsonProperty hints.
    options.compilerArgs += ['-parameters']
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = "full"
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.2.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.2.2'
    implementation 'org.postgresql:postgresql:42.6.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.4.3.Final'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.2.2'
    // TestRestTemplate's default JDK HttpURLConnection-backed request factory throws
    // HttpRetryException ("cannot retry due to server authentication, in streaming mode") when a
    // POST with a body gets back a 401 - a JDK-level quirk, not an application bug. Apache
    // HttpClient doesn't have this limitation; see FacadeIT.
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
    testImplementation 'org.testcontainers:testcontainers:2.0.2'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.2'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.2'
}
