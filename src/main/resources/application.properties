server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5442/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SECURITY: these defaults are fine for local dev and CI (Testcontainers, ephemeral DBs) but must
# be overridden with real secrets via the env vars below in any shared/deployed environment.
# Client apps (e.g. karata) submitting payment claims use ifay.client-api-key; verifier apps
# (e.g. porofo) reporting confirmed payments use ifay.verifier-api-key - kept separate since the
# two represent different trust levels.
ifay.client-api-key=${IFAY_CLIENT_API_KEY:dev-only-insecure-client-key-change-me}
ifay.verifier-api-key=${IFAY_VERIFIER_API_KEY:dev-only-insecure-verifier-key-change-me}
